name: DTECT AWS Deploy

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dtect-production-deploy
  cancel-in-progress: false

jobs:
  deploy-check:
    name: AWS Deployment
    runs-on:
      - self-hosted
      - Linux
      - X64

    timeout-minutes: 20

    steps:
      - name: Verify deployment environment
        run: |
          echo "D:TECT AWS Runner connected"
          whoami
          hostname

      - name: Run deployment dry-run
        run: |
          sudo -n /opt/dtect-deploy/check.sh

      - name: Deploy to AWS
        run: |
          sudo -n /opt/dtect-deploy/auto-deploy.sh
